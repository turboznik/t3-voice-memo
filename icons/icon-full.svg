<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#e3342a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#shine)"/>
  <!-- sound waves -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="22">
    <path d="M118 196 v120" opacity=".55"/>
    <path d="M394 196 v120" opacity=".55"/>
    <path d="M78 228 v56" opacity=".35"/>
    <path d="M434 228 v56" opacity=".35"/>
  </g>
  <!-- microphone -->
  <rect x="200" y="96" width="112" height="212" rx="56" fill="#fff"/>
  <path d="M160 252 a96 96 0 0 0 192 0" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
  <path d="M256 350 v58" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
  <path d="M206 414 h100" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
</svg>
